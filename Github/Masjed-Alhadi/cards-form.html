<!-- به نام خداوند بخشنده مهربان -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- عنوان و نسخه صفحه کارت‌ها -->
  <title>مسجد الهادی - انتخاب نیت خیر</title>

  <!-- آیکن و استایل صفحه کارت‌ها -->
  <!-- کارکرد: بارگذاری آیکن و فایل CSS اختصاصی کارت‌ها -->
  <link rel="icon" href="images/logo/icon.webp" type="image/webp" />
  <link rel="stylesheet" href="cards-styles.css" />

  <!-- اسکریپت تحلیل -->
  <!-- کارکرد: بارگذاری Clarity برای ردیابی تعاملات - بدون تغییر منطقی -->
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      var h = (l.location && l.location.hostname) || c.location.hostname;
      var isLocal = (c.location.protocol !== 'https:') || /^(localhost|127\.0\.0\.1)$/i.test(h);
      if (isLocal) { c[a] = c[a] || function () { }; return; }
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;

</head>

<body>
  <!-- عنوان اصلی صفحه برای صفحه‌خوان‌ها (غیرمرئی) -->
  <h1 class="visually-hidden">درگاه پرداخت گروه جهادی بسیج — انتخاب نیت خیر</h1>

  <!-- لینک پرش به محتوا برای دسترس‌پذیری -->
  <a href="#gateway-panel" class="skip-link" aria-label="پرش به محتوای اصلی">پرش به محتوا</a>

  <!-- پس‌زمینه گرادیانی روز/شب -->
  <!-- کارکرد: دو لایه برای تغییر تدریجی تم با سوییچ روز/شب -->
  <div class="theme-bg" aria-hidden="true">
    <i class="layer day"></i>
    <i class="layer night"></i>
  </div>

  <!-- لایه تزئینی ثابت زیر کارت‌ها -->
  <!-- کارکرد: تصویر زمینه ثابت که پس از اتمام توالی ورود کارت‌ها ظاهر می‌شود -->
  <div class="cards-bg-fixed" aria-hidden="true"></div>

  <!-- ظرف افکت «بارش لوگو» (در حالت بسته پنل) -->
  <!-- کارکرد: افکت دعوت‌کننده قبل از بازشدن کارت‌ها -->
  <div id="logo-rain" aria-hidden="true"></div>

  <!-- سربرگ و دکمه باز/بسته پنل کارت‌ها -->
  <!-- کارکرد: با کلیک، پنل کارت‌ها باز/بسته و انیمیشن‌ها مدیریت می‌شود -->
  <header class="header-bar" role="banner">
    <button id="gateway-trigger" class="title-button" aria-controls="gateway-panel" aria-expanded="false">
      <div class="title-frame">
        <picture class="title-picture">
          <source srcset="images/logo/masjed-alhadi-text.svg" media="(max-width:650px)" />
          <img src="images/logo/masjed-alhadi-text.svg" alt="مسجد الهادی - سامانه نذورات و کمک‌های مؤمنانه" />
        </picture>
      </div>
    </button>

    <!-- راهنمای کلیک: کاربر را به باز کردن پنل دعوت می‌کند -->
    <!-- کارکرد: با کلیک روی آن هم پنل باز می‌شود؛ پس از باز شدن محو می‌گردد -->
    <button id="gate-hint" class="gate-hint" type="button">
      <span class="gate-hint-text">برای مشاهده نیات خیر، روی عنوان بزنید</span>
      <span class="gate-hint-arrow" aria-hidden="true">⌄</span>
    </button>
  </header>

  <!-- کنترل‌های دسکتاپ: تغییر نمای کارت‌ها -->
  <!-- کارکرد: دکمه‌های کوچک/بزرگ برای تغییر چیدمان شبکه کارت‌ها -->
  <div id="desktop-controls-left" class="desktop-fixed controls-fade hide" aria-label="نمای کارت‌ها">
    <div class="view-switcher">
      <button type="button" data-view="small" aria-pressed="true" aria-label="نمای کوچک" data-tooltip="نمای کوچک">
        <span class="png-icon"><img src="images/logo/medium-cards.png" alt="کوچک" /></span>
      </button>
      <button type="button" data-view="big" aria-pressed="false" aria-label="نمای بزرگ" data-tooltip="نمای بزرگ">
        <span class="png-icon"><img src="images/logo/large-cards.png" alt="بزرگ" /></span>
      </button>
    </div>
  </div>

  <!-- کنترل‌های دسکتاپ: تغییر حالت روز/شب -->
  <!-- کارکرد: سوییچ تم برای پس‌زمینه و رنگ‌ها -->
  <div id="desktop-controls-right" class="desktop-fixed controls-fade hide" aria-label="حالت روز/شب">
    <div class="day-night-switcher">
      <button type="button" data-mode="day" aria-pressed="true" aria-label="حالت روز" data-tooltip="روز">
        <span class="png-icon"><img src="images/logo/sun.png" alt="روز" /></span>
      </button>
      <button type="button" data-mode="night" aria-pressed="false" aria-label="حالت شب" data-tooltip="شب">
        <span class="png-icon"><img src="images/logo/moon.png" alt="شب" /></span>
      </button>
    </div>
  </div>

  <!-- پنل کارت‌ها: در آغاز بسته است و با دکمه باز می‌شود -->
  <!-- کارکرد: شامل ردیف کنترل‌های موبایل و گرید کارت‌ها -->
  <main id="gateway-panel" class="gateway-panel collapsed" role="region" aria-label="فهرست کارت‌ها">
    <section class="cards-bg-green">

            <span class="png-icon"><img src="images/logo/moon.png" alt="شب" /></span>
          </button>
        </div>
      </div>

      <!-- گرید کارت‌ها -->
      <!-- کارکرد: هر کارت یا منوی چندسطحی (data-menu) دارد یا لینک مستقیم (data-url) -->
      <div class="cards-container view-small" id="cards-container">
        <!-- 1: کمک به مسجد (منوی ساده) -->
        <!-- کارکرد: هزینه‌های جاری مسجد و مراسمات اهل بیت -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-menu='[
            {"title":"هزینه‌های جاری مسجد","url":"payment-form.html?cause=کمک_به_مسجد_هزینه‌های_جاری_مسجد"},
            {"title":"مراسمات اهل بیت","url":"payment-form.html?cause=کمک_به_مسجد_مراسمات_اهل_بیت"}
          ]'>
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-01.webp" alt="کمک به مسجد"

            <div class="card-overlay">
              <div class="card-title">کمک به مسجد</div>
            </div>
          </article>
        </div>

<!-- 2: وجوهات شرعی (منوی چندسطحی) -->

            {"title":"کفاره","submenu":[
              {"title":"کفاره عام","url":"payment-form.html?cause=وجوهات_شرعی_کفاره_عام"},

        </div>

        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>

          </article>
        </div>

        <!-- 5: صدقه اول ماه (لینک مستقیم) -->
        <!-- کارکرد: مسیر مستقیم با cause -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=صدقه_اول_ماه">

        <!-- کارکرد: ذبح گوسفند و عقیقه -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>

        <!-- کارکرد: مسیر مستقیم با cause -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=نذر_عام">
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-07.webp" alt="نذر عام"
              onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay">
              <div class="card-title">نذر عام</div>
            </div>
          </article>
        </div>

        <!-- 8: وجوهات شرعی (منوی چندسطحی) -->
        <!-- کارکرد: منوی تو در تو برای خمس/کفاره/فطریه + موارد مستقل -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-menu='[
            {"title":"خمس","submenu":[
              {"title":"خمس عام","url":"payment-form.html?cause=وجوهات_شرعی_خمس_عام"},
              {"title":"خمس سادات","url":"payment-form.html?cause=وجوهات_شرعی_خمس_سادات"}
            ]},
            {"title":"کفاره","submenu":[
              {"title":"کفاره عام","url":"payment-form.html?cause=وجوهات_شرعی_کفاره_عام"},
              {"title":"کفاره سادات","url":"payment-form.html?cause=وجوهات_شرعی_کفاره_سادات"}
            ]},
            {"title":"فطریه","submenu":[
              {"title":"فطریه عام","url":"payment-form.html?cause=وجوهات_شرعی_فطریه_عام"},
              {"title":"فطریه سادات","url":"payment-form.html?cause=وجوهات_شرعی_فطریه_سادات"}
            ]},
            {"title":"خیرات اموات","url":"payment-form.html?cause=وجوهات_شرعی_خیرات_اموات"},

            <div class="card-overlay">
              <div class="card-title">وجوهات شرعی</div>
            </div>
          </article>
        </div>

        <!-- 9: نذر عام (لینک مستقیم) -->
        <!-- کارکرد: مسیر مستقیم با cause -->
        <div class="card-wrap">
          <i class="card-deco narges narges-tl"></i><i class="card-deco narges narges-br"></i>
          <article class="card" data-url="payment-form.html?cause=نذر_عام">
            <span class="basij-flash"></span>
            <img loading="lazy" src="images/cards/card-10.webp" alt="نذر عام"
              onerror="this.onerror=null;this.src='images/cards/fallback.webp';this.classList.add('missing')" />
            <div class="card-overlay">

  <!-- باند گرادیانی و کپیرایت پایین صفحه -->
  <!-- کارکرد: نمایش متناوب پیام انگلیسی/فارسی با انیمیشن آهسته -->
  <div class="credit-band" aria-hidden="true"></div>
  <div class="credit" id="credit" role="note" aria-live="polite">
    <span class="credit-line en" dir="ltr">Commissioned by Masjed-Alhadi Development Team</span>
    <span class="credit-line fa" dir="rtl">به سفارش و همت تیم توسعه مسجد الهادی</span>
  </div>

  <!-- اسکریپت‌های صفحه کارت‌ها -->
  <!-- کارکرد: مدیریت افکت‌ها، کنترل‌ها، منوهای چندسطحی و کلیک کارت‌ها -->
  <script src="src/js/utils.js"></script>
  <script src="src/js/data.js"></script>
  <script src="cards-scripts.js"></script>
